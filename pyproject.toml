[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope"
version = "0.1.0"
description = "Profiler for long-horizon agent workloads: token usage, latency, context growth, retries, and tool calls."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
